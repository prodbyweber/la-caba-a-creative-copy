<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://media.base44.com/images/public/6966ddf48947f217e81ea27c/6b7c4002a_Titulo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Audio en segundo plano: iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Cabaña Creative</title>
    <meta
      name="description"
      content="Cabaña Creative es la plataforma para artistas y creadores: producción musical, mezcla y master, beatmaking personalizado y desarrollo de catálogo."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:description"
      content="Cabaña Creative es la plataforma para artistas y creadores: producción musical, mezcla y master, beatmaking personalizado y desarrollo de catálogo."
    />
    <!-- Píxeles de anuncios (Google Ads y Meta). Se cargan solo en la web
         publicada: dentro del editor/preview (iframe, sin cookies de terceros)
         fallan y el navegador los reporta como "Script error." -->
    <script>
      (function () {
        window.dataLayer = window.dataLayer || [];

        var framed = true;
        try {
          framed = window.top !== window.self;
        } catch (e) {
          framed = true;
        }

        if (framed) {
          window.gtag = function () {};
          window.fbq = function () {};
          return;
        }

        window.gtag = function () {
          window.dataLayer.push(arguments);
        };

        var load = function (src) {
          try {
            var s = document.createElement("script");
            s.async = true;
            s.src = src;
            document.head.appendChild(s);
          } catch (e) {
            /* nunca romper la app por un píxel */
          }
        };

        var boot = function () {
          try {
            gtag("js", new Date());
            gtag("config", "AW-18190555269");
            load("https://www.googletagmanager.com/gtag/js?id=AW-18190555269");

            !(function (f, b, e, v, n, t, s) {
              if (f.fbq) return;
              n = f.fbq = function () {
                n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
              };
              if (!f._fbq) f._fbq = n;
              n.push = n;
              n.loaded = true;
              n.version = "2.0";
              n.queue = [];
              t = b.createElement(e);
              t.async = true;
              t.src = v;
              s = b.getElementsByTagName(e)[0];
              s.parentNode.insertBefore(t, s);
            })(window, document, "script", "https://connect.facebook.net/en_US/fbevents.js");

            fbq("init", "1701297601087526");
            fbq("track", "PageView");
          } catch (e) {
            /* nunca romper la app por un píxel */
          }
        };

        if (document.readyState === "complete") boot();
        else window.addEventListener("load", boot);
      })();
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: #0a0a0b; min-height: 100%; min-height: 100dvh; }
      body {
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
      }
      #root {
        background: #0a0a0b;
        min-height: 100dvh;
      }

      /* Ocultar controles nativos del navegador en todos los vídeos */
      video::-webkit-media-controls,
      video::-webkit-media-controls-enclosure,
      video::-webkit-media-controls-panel,
      video::-webkit-media-controls-overlay-play-button,
      video::-webkit-media-controls-start-playback-button { display: none !important; }
      video { -webkit-appearance: none; }

      #splash {
        position: fixed;
        inset: 0;
        background: #0a0a0b;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 999999;
        opacity: 1;
        transition: opacity 0.6s ease;
      }
      #splash.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      #splash img {
        width: 64px;
        height: 64px;
        object-fit: contain;
        animation: cabana-pulse 1.6s ease-in-out infinite;
      }
      @keyframes cabana-pulse {
        0%, 100% { opacity: 1;   transform: scale(1); }
        50%       { opacity: 0.6; transform: scale(0.93); }
      }

    </style>
  </head>
  <body>
    <div id="splash">
      <img
        src="https://media.base44.com/images/public/6966ddf48947f217e81ea27c/6b7c4002a_Titulo.png"
        alt="Cabaña Creative"
      />
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Meta Pixel: la carga está en <head>, solo en la web publicada. -->
    <noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=1701297601087526&ev=PageView&noscript=1" /></noscript>
    <!-- End Meta Pixel Code -->

    <script>
      // Expose a global function that React calls when the app is truly ready
      window.__cabanaHideSplash = function () {
        var splash = document.getElementById('splash');
        if (!splash) return;
        splash.classList.add('fade-out');
        setTimeout(function () {
          if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
        }, 650);
      };

      // Hard fallback: never leave user stuck > 6s
      setTimeout(function () {
        window.__cabanaHideSplash && window.__cabanaHideSplash();
      }, 6000);
    </script>
  </body>
</html>
